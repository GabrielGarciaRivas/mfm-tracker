# Builds "Free Market Tracker" for Windows (.exe), macOS (.app, Apple silicon) and
# Linux on GitHub's servers. Run it from the Actions tab ("Run workflow"); fill in
# a version tag there (e.g. v2610.7.001), or push such a tag, to also publish the
# files as a GitHub release.
name: Build apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "To publish a release too, enter its version tag (e.g. v2610.7.001); leave empty to just build"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract OCR
        run: choco install tesseract -y --no-progress
      - name: Build
        shell: pwsh
        env:
          PYTHON: python
        run: ./packaging/build_windows.ps1
      - name: Smoke test (OCR through the packaged app)
        shell: pwsh
        run: |
          & "dist/Free Market Tracker.exe" selftest | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Free Market Tracker (Windows)
          path: dist/Free Market Tracker.exe

  macos:
    runs-on: macos-15            # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract OCR
        run: brew install tesseract
      - name: Build (includes an OCR self-test of the finished app)
        env:
          PYTHON: python
        run: packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Free Market Tracker (macOS)
          path: dist/Free Market Tracker (macOS).zip

  linux:
    # the oldest supported Ubuntu, so the app runs on older and newer distros alike
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools, English OCR data and Tk
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-eng tk-dev cmake ninja-build libpng-dev zlib1g-dev
      - name: Build a self-contained Tesseract 5.3.4
        run: packaging/build_tesseract_static.sh
      - name: Build
        run: |
          python -m pip install pyinstaller pillow pytesseract mss pyspellchecker certifi pynput
          PYTHON=python packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Free Market Tracker (Linux)
          path: |
            dist/Free Market Tracker
            dist/free-market-tracker.desktop
            dist/free-market-tracker.png

  release:
    # published even when GitHub has no Mac free for a long time (the macOS job is
    # cancelled): Windows and Linux go out, and running the build again with the same
    # tag adds the Mac app to the release
    if: >-
      always() && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
      && needs.windows.result == 'success' && needs.linux.result == 'success'
      && needs.macos.result != 'failure'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Package the apps (the file names carry the version; the apps don't)
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VER="${TAG#v}"
          cd out
          mkdir -p pkg
          (cd "Free Market Tracker (Windows)" && zip -q -9 "../pkg/Free-Market-Tracker-$VER-Windows.zip" "Free Market Tracker.exe")
          if [ -f "Free Market Tracker (macOS)/Free Market Tracker (macOS).zip" ]; then
            cp "Free Market Tracker (macOS)/Free Market Tracker (macOS).zip" "pkg/Free-Market-Tracker-$VER-macOS.zip"
          else
            echo "::warning::No Mac app this time (GitHub had no Mac free): run the build again with this tag to add it."
          fi
          chmod +x "Free Market Tracker (Linux)/Free Market Tracker"
          mv "Free Market Tracker (Linux)" "Free Market Tracker"     # a tar.gz keeps it executable
          tar -czf "pkg/Free-Market-Tracker-$VER-Linux.tar.gz" "Free Market Tracker"
          ls -la pkg
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: CHANGELOG.md
      - name: Release notes (downloads + this version's CHANGELOG section)
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["TAG"].lstrip("v")
          try:
              text = open("src/CHANGELOG.md", encoding="utf-8").read()
          except OSError:
              text = ""
          m = re.search(r"^## " + re.escape(tag) + r"\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          notes = m.group(1).strip() if m else ""
          v = tag
          downloads = f"""## Downloads
          - **Windows:** `Free-Market-Tracker-{v}-Windows.zip`. Unzip it and double-click `Free Market Tracker.exe`. If Windows says "Windows protected your PC", click **More info → Run anyway**.
          - **macOS (Apple silicon):** `Free-Market-Tracker-{v}-macOS.zip`. Unzip and drag the app to Applications. If macOS won't open it, go to System Settings → Privacy & Security and click **Open Anyway**. Allow **Screen Recording** when asked, then quit and reopen the app.
          - **Linux:** `Free-Market-Tracker-{v}-Linux.tar.gz`. Extract it and double-click `Free Market Tracker`.

          Nothing else needs to be installed. The README explains how to use it.
          """
          downloads = "\n".join(line.strip() if line.strip().startswith(("-", "#", "Nothing")) else line
                                for line in downloads.splitlines())
          body = (("## What's new\n\n" + notes + "\n\n") if notes else "") + downloads
          open("notes.md", "w", encoding="utf-8").write(body)
          print(body)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Free Market Tracker ${{ inputs.release_tag || github.ref_name }}
          body_path: notes.md
          files: out/pkg/*
